name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: npm ci
      - run: npm test
      - name: Validate AYA V1 regression catalog
        run: >-
          python3 deploy/scripts/aya_v1_regression.py
          --skip-suite
          --output-dir reports/aya-v1/ci
      - name: Validate deploy scripts
        run: >-
          python3 -m py_compile
          deploy/qr-server.py
          deploy/scripts/ab_aya_score.py
          deploy/scripts/aya_v1_regression.py
          deploy/scripts/tick_whatsapp_followups.py
